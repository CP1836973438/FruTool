[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "frutool"
dynamic = ["version"]
description = "FRU 硬件信息自动化配置与备份工具"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "CP Studio" }]
dependencies = [
    "PyQt6==6.8.1",
    "PyQt6-Qt6==6.8.1",
    "pyinstaller>=6.0",
    "py7zr>=0.21",
    "rarfile>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
frutool = "frutool.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["frutool*"]

[tool.setuptools.dynamic]
version = { attr = "frutool.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=frutool.domain --cov-config=.coveragerc --cov-report=term-missing"
markers = [
    "smoke: QML bootstrap and packaging smoke tests (requires PyQt6 display)",
]
