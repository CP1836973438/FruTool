name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  domain-tests:
    name: Domain tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run domain unit tests
        run: python -m pytest tests/ -v -m "not smoke"

  smoke-tests:
    name: QML smoke tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run smoke tests
        run: python -m pytest tests/test_smoke.py -v -m smoke --no-cov
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_CONTROLS_STYLE: Basic
          FRUTOOL_SKIP_ADMIN: "1"
          FRUTOOL_SMOKE: "1"

  package:
    name: PyInstaller build
    runs-on: windows-latest
    needs: [domain-tests, smoke-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean FRUTool.spec

      - name: Verify packaged executable
        shell: pwsh
        run: ./scripts/verify_dist.ps1

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: FRUTool-windows
          path: dist/FRUTool.exe
          if-no-files-found: error
